<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UYG Studio</title>
<meta name="description" content="UYG Studio — mobile apps.">
<style>
  :root { --bg: #fbf8f2; --text: #221d16; --muted: #6b6255; --accent: #9a6b12; --line: #e6dfd2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16130f; --text: #efe8dc; --muted: #a99f90; --accent: #e7b75a; --line: #2e2922; }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; line-height: 1.25; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  h2 { font-size: 1.3rem; margin: 36px 0 4px; }
  p { margin: 0 0 12px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .app { border-top: 1px solid var(--line); padding-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>UYG Studio</h1>
  <p class="muted">Mobile apps · Mobil uygulamalar</p>

  <section class="app">
    <h2>Artwall</h2>
    <p>A masterpiece every day, as your wallpaper. · Her gün bir başyapıt, duvar kağıdın olsun.</p>
    <p>
      <a href="artwall/privacy.html">Privacy Policy · Gizlilik Politikası</a><br>
      <a href="artwall/terms.html">Terms of Use · Kullanım Şartları</a>
    </p>
  </section>

  <p class="muted" style="margin-top: 40px">Contact · İletişim: <a href="mailto:uygstudio@gmail.com">uygstudio@gmail.com</a></p>
</main>
</body>
</html>
